    <script>
      // Make window.fetch writable to prevent extension interceptors from crashing on getter-only property
      try {
        let _fetch = window.fetch ? window.fetch.bind(window) : undefined;
        Object.defineProperty(window, 'fetch', {
          configurable: true,
          enumerable: true,
          get() {
            return _fetch;
          },
          set(fn) {
            _fetch = fn;
          },
        });
      } catch (e) {
        // Safe fallback
      }
    </script>
